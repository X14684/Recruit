server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: campus-recruitment
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_recruitment?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      connection-init-sql: SET NAMES utf8mb4
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10s
      connect-timeout: 2s
  cache:
    type: none
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campus.recruitment.modules.*.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: campus-recruitment-secret-key-2024-very-long-string
  expiration: 86400000   # 24小时 ms
  header: Authorization
  prefix: "Bearer "

knife4j:
  enable: true
  setting:
    language: zh_cn

# 文件上传配置
file:
  upload:
    path: ./uploads
    max-size: 10485760  # 10MB

logging:
  level:
    com.campus.recruitment: debug
